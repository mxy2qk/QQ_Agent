[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qq-personal-agent"
version = "0.1.0"
description = "DeepSeek + LangGraph personal agent, CLI first"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.60,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-core>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
qq-agent = "qq_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qq_agent"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: opt-in requests to the configured DeepSeek API"]

[tool.ruff]
target-version = "py311"
line-length = 100
